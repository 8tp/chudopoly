<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ART §2: the apron at night is a NEUTRAL near-black, not the retired navy. -->
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#DFD7C5" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Chudopoly — an Air Force card table. Monopoly Deal, tactical edition.">
<meta name="application-name" content="CHUDOPOLY">
<meta name="apple-mobile-web-app-title" content="CHUDOPOLY">
<title>CHUDOPOLY</title>
<!-- The app icon is the DECK MARK — the pre-press alignment target from the
     card back (844f99e) — reversed out of a solid --card-back tile, so the tab
     carries an object rather than an outline. Every one of these is generated
     by server/icon.js and served from a route: §0.3 bans .svg and .png files
     in the repo, so nothing binary exists to commit. The SVG is a redraw for
     16px, not a scale of the back; the PNGs carry the full mark. -->
<link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg?v=1">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/icon-32.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=1">
<link rel="manifest" href="/manifest.webmanifest?v=1">
<link rel="stylesheet" href="/style/variables.css?v=1">
<link rel="stylesheet" href="/style/base.css?v=1">
<link rel="stylesheet" href="/style/table.css?v=1">
<link rel="stylesheet" href="/style/ui.css?v=1">
<link rel="stylesheet" href="/style/motion.css?v=1">
<link rel="stylesheet" href="/style/interact.css?v=1">
<link rel="stylesheet" href="/style/content.css?v=1">
<link rel="stylesheet" href="/style/lobby.css?v=1">
<!-- last: cardart owns what is PRINTED ON a card and hands the host .card off -->
<link rel="stylesheet" href="/style/cardart.css?v=1">
</head>
<body>
<div id="app">

  <!-- ── HOME ───────────────────────────────────────────────────────────
       ART §3.3: "the home screen IS the table, seen from above, with the deck
       sitting on it and the actions painted into the apron as markings."

       COMPOSITION, round 6. Measured on the previous build at 1440x900: the ink
       occupied 55.6% of the viewport height with 22.2% dead apron above it and
       22.2% below, and the two masses sat at 30% and 66% of the width with
       nothing between them. The bounding box was dead-centre; the WEIGHT was
       not, and a menu made of two half-weight objects floating in a hole is
       what "unfinished" looks like.

       The fix is not to centre the wordmark and hope. It is that MARKINGS RUN
       TO THE EDGE OF THE FRAME AND OBJECTS DO NOT. A painted apron is anchored
       by its lines, not by its furniture, so this screen is three registers:

         head   the wordmark plate, painted on the concrete, with a rule under
                it that reaches both edges of the viewport
         table  the deck — the largest object on screen, because the deck IS
                the subject and a card game's menu should show cards
         rail   the hold-short line, edge to edge, with the marshalling area
                painted along it: call sign, the ink slab, the alternates, and
                the two edge marks (how to play; sound)

       Every edge of the frame now carries a marking, the wordmark is centred
       WITHOUT floating (the rule under it is what holds it down), and the deck
       is the hero it was always supposed to be. Same three registers at every
       width — only the rail's internal arrangement changes. -->
  <section id="screen-home" class="screen screen-home">
    <div class="home">

      <header class="home-head">
        <h1 class="brand-title">
          <svg class="brand-mark" viewBox="0 0 724 220" fill-rule="evenodd"
               role="img" aria-label="Chudopoly"><title>Chudopoly</title>
            <rect width="724" height="220" fill="var(--card-stock)"/>
            <path fill="var(--ink)" d="M13 13 H711 V207 H13 Z M20 20 H704 V200 H20 Z"/>
            <g fill="var(--ink)">
              <path d="M5 5 H84 V12 H12 V60 H5 Z"/>
              <path d="M719 5 V60 H712 V12 H640 V5 Z"/>
              <path d="M5 215 V160 H12 V208 H84 V215 Z"/>
              <path d="M719 215 H640 V208 H712 V160 Z"/>
            </g>
            <g transform="translate(73 53)">
              <path fill="var(--ca-drop, #A2977E)" d="M16 0 H62 V20 H20 V80 H62 V100 H16 L0 84 V16 Z M72.0 0 H92.0 V40 H114.0 V0 H134.0 V100 H114.0
             V60 H92.0 V100 H72.0 Z M144.0 0 H164.0 V80 H186.0 V0 H206.0 V84 L190.0 100 H160.0 L144.0 84 Z
             M216.0 0 H262.0 L278.0 16 V84 L262.0 100 H216.0 Z M298.0 0 H328.0 L344.0 16 V84 L328.0 100
             H298.0 L282.0 84 V16 Z M350.0 0 H396.0 L412.0 16 V44 L396.0 60 H370.0 V100 H350.0 Z M429.0 0
             H459.0 L475.0 16 V84 L459.0 100 H429.0 L413.0 84 V16 Z M480.0 0 H500.0 V80 H542.0 V100 H480.0 Z
             M534.0 0 H556.0 L565.0 26 L574.0 0 H596.0 L575.0 48 V100 H555.0 V48 Z"/>
            </g>
            <g transform="translate(64 44)">
              <path fill="var(--ink)" d="M16 0 H62 V20 H20 V80 H62 V100 H16 L0 84 V16 Z M72.0 0 H92.0 V40 H114.0 V0 H134.0 V100 H114.0
             V60 H92.0 V100 H72.0 Z M144.0 0 H164.0 V80 H186.0 V0 H206.0 V84 L190.0 100 H160.0 L144.0 84 Z
             M216.0 0 H262.0 L278.0 16 V84 L262.0 100 H216.0 Z M236.0 20 H254.0 L258.0 24 V76 L254.0 80
             H236.0 Z M298.0 0 H328.0 L344.0 16 V84 L328.0 100 H298.0 L282.0 84 V16 Z M306.0 20 H320.0 L324.0
             24 V76 L320.0 80 H306.0 L302.0 76 V24 Z M350.0 0 H396.0 L412.0 16 V44 L396.0 60 H370.0 V100
             H350.0 Z M370.0 20 H388.0 L392.0 24 V36 L388.0 40 H370.0 Z M429.0 0 H459.0 L475.0 16 V84 L459.0
             100 H429.0 L413.0 84 V16 Z M437.0 20 H451.0 L455.0 24 V76 L451.0 80 H437.0 L433.0 76 V24 Z
             M480.0 0 H500.0 V80 H542.0 V100 H480.0 Z M534.0 0 H556.0 L565.0 26 L574.0 0 H596.0 L575.0 48
             V100 H555.0 V48 Z"/>
            </g>
            <!-- The GO chip lived here — a reversed revision-block bottom right.
                 OWNER RULING 2026-08-07: the game is CHUDOPOLY. The suffix was
                 inherited from the one-night build and never earned anything, and
                 the card back had already been saying CHUDOPOLY on its own. -->
          </svg>
        </h1>
        <p class="brand-sub">Monopoly Deal, flight-line edition. Three complete sets and you are wheels up.</p>
      </header>

      <!-- THE DECK IS BUILT, NOT WRITTEN.
           This element was 11 hand-authored spans: two copies of the Fighters
           and Space Force glyphs, a bespoke value coin at left:8%/bottom:7%
           that matched nothing on a real card, and a back carrying only the
           alignment target. The card art has been redrawn three times since
           those copies were made and they were stale on arrival — the owner's
           read was "tacky / not well made", and the reason is that they are not
           the cards. src/ui/home.js now fills this from table/cardart.js's own
           faceNode()/backNode(), so the menu shows the ACTUAL printed card, the
           coin sits where the card design puts it, and every future art change
           lands here for free. Decorative: aria-hidden, no [data-card-id], and
           nowhere near a .cardzone, so nothing that reconciles the table can
           mistake these for cards in play (§0.4). -->
      <div class="home-table">
        <div id="home-deck" class="home-deck" aria-hidden="true"></div>
        <!-- 106, not 104: buildDeck() returns 106 and has for some time. The
             literal was written by hand and then never re-read, which is the
             whole argument for the deck above it now being built from
             cardart.js rather than copied. A number nobody derives is a number
             that drifts. -->
        <p class="home-deck-tag">106 cards &middot; 2&ndash;5 seats</p>
      </div>

      <!-- the hold-short line and everything painted along it -->
      <div class="home-rail">
        <div class="home-actions">
          <p id="home-greet" class="home-greet" hidden></p>
          <div class="home-slot">
            <label class="field-label" for="name-input">Call sign</label>
            <input id="name-input" class="field" type="text" maxlength="16" autocomplete="off"
                   autocapitalize="characters" placeholder="Who is flying?">
          </div>
          <button id="btn-quick-play" class="btn btn-primary home-go" data-action="quick-play">Quick play vs bots</button>
          <div class="home-alt">
            <button id="btn-create-room" class="btn" data-action="create-room">Create room</button>
            <div class="home-join">
              <input id="code-input" class="field field-code" type="text" maxlength="4" autocomplete="off"
                     placeholder="CODE" aria-label="Room code">
              <button id="btn-join-room" class="btn" data-action="join-room">Join</button>
            </div>
          </div>
          <p id="home-error" class="error" role="alert" aria-live="polite"></p>
        </div>

        <button class="btn btn-ghost home-help" data-action="help">How to play</button>

        <!-- §7's music bed starts on the first pointerdown anywhere, and until
             now the only switch for it lived inside the game screen's settings
             sheet — so a player who tapped Quick Play got a bed they could not
             silence until the table had loaded. audio/engine.js documents
             setMusicEnabled() as safe to call before a gesture, and pointer.js
             dispatches on window capture, ahead of main.js's unlock listener,
             so pressing this as the FIRST gesture of the session mutes the bed
             before it is ever attached. -->
        <button id="btn-home-sound" class="btn btn-ghost home-sound" data-action="home-sound"
                aria-pressed="true">
          <svg class="home-sound-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="home-sound-cone" d="M3 9 H7 L12 4.5 V19.5 L7 15 H3 Z"/>
            <path class="home-sound-wave" d="M15.4 8.2 A5.2 5.2 0 0 1 15.4 15.8 L14.1 14.1
                     A3 3 0 0 0 14.1 9.9 Z M18.1 5.1 A9 9 0 0 1 18.1 18.9 L16.9 17.3
                     A6.9 6.9 0 0 0 16.9 6.7 Z"/>
            <path class="home-sound-cut" d="M15.2 8.6 L16.6 7.2 L22.4 13 L21 14.4 Z
                     M21 7.2 L22.4 8.6 L16.6 14.4 L15.2 13 Z"/>
          </svg>
          <span id="home-sound-label">Sound on</span>
        </button>
      </div>

    </div>
  </section>

  <!-- ── LOBBY ──────────────────────────────────────────────────────── -->
  <section id="screen-lobby" class="screen screen-lobby" hidden>
    <div class="panel lobby-panel">
      <h2 class="lobby-title">ROOM <span id="lobby-code" class="lobby-code"></span></h2>
      <button id="btn-invite" class="btn btn-ghost" data-action="copy-invite">Copy invite link</button>
      <div id="lobby-players" class="lobby-players"></div>

      <div id="lobby-host" class="lobby-host" hidden>
        <div class="row">
          <label class="field-label" for="bot-mode">BOT</label>
          <select id="bot-mode" class="field">
            <option value="random">Random</option>
            <option value="conservative">Conservative</option>
            <option value="neutral" selected>Neutral</option>
            <option value="aggressive">Aggressive</option>
            <option value="chud">CHUD</option>
          </select>
          <button id="btn-add-bot" class="btn" data-action="add-bot">Add bot</button>
        </div>
        <div class="row">
          <label class="field-label" for="turn-timeout">TURN</label>
          <select id="turn-timeout" class="field">
            <option value="0">off</option>
            <option value="30">30s</option>
            <option value="60" selected>60s</option>
            <option value="120">120s</option>
          </select>
          <label class="field-label" for="response-timeout">REPLY</label>
          <select id="response-timeout" class="field">
            <option value="0">off</option>
            <option value="15">15s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
        </div>
        <button id="btn-start" class="btn btn-primary" data-action="start-game">Launch Mission</button>
      </div>

      <p id="lobby-hint" class="hint" aria-live="polite">Waiting for the host to launch&hellip;</p>
      <button class="btn btn-ghost" data-action="leave-room">Leave room</button>
    </div>
  </section>

  <!-- ── GAME ───────────────────────────────────────────────────────── -->
  <section id="screen-game" class="screen screen-game" hidden>
    <header id="hud" class="hud">
      <div class="hud-left">
        <span id="hud-room" class="chip"></span>
        <span id="hud-conn" class="conn" title="Connection"></span>
      </div>
      <div class="hud-mid">
        <span id="hud-turn" class="hud-turn" aria-live="polite"></span>
        <span id="hud-plays" class="chip"></span>
        <span id="hud-timer" class="timer" hidden><span id="hud-timer-text" class="timer-text"></span></span>
      </div>
      <div class="hud-right">
        <!-- The glyphs are drawn in ui.css as masks (one per data-action), in the
             same solid-silhouette family as the card glyphs. The buttons ship
             empty: a Unicode dingbat here was the last generic mark in the app. -->
        <button id="btn-side" class="btn btn-icon" data-action="toggle-side" aria-label="Mission log and comms"></button>
        <button class="btn btn-icon" data-action="help" aria-label="Rules"></button>
        <button class="btn btn-icon" data-action="leave-room" aria-label="Leave game"></button>
      </div>
    </header>

    <main id="table" class="table">
      <div id="opponents" class="opponents"></div>

      <div id="table-center" class="table-center">
        <div class="pile">
          <div class="cardzone zone-deck" data-zone="deck"></div>
          <span class="pile-label">Deck <span id="deck-count">0</span></span>
        </div>
        <div class="pile">
          <div class="cardzone zone-discard" data-zone="discard"></div>
          <span class="pile-label">Discard <span id="discard-count">0</span></span>
        </div>
      </div>

      <div id="self-board" class="self-board"></div>
    </main>

    <div id="prompt" class="prompt" hidden aria-live="polite"></div>

    <footer id="hand-dock" class="hand-dock">
      <div class="hand-bar">
        <span class="hand-label">Hand <span id="hand-count">0</span></span>
        <div class="hand-actions">
          <button id="btn-draw" class="btn" data-action="draw">Draw</button>
          <button id="btn-end-turn" class="btn" data-action="end-turn">End turn</button>
          <button id="btn-emote" class="btn btn-icon" data-action="emote" aria-label="Emote"></button>
          <!-- NOT .btn-danger: ART §1 reserves hazard material for danger, and a
               permanently-striped button in the dock of every table shot spends
               the material before the final-approach rails ever rise. -->
          <button id="btn-scoop" class="btn btn-icon" data-action="scoop" aria-label="Scoop out"></button>
        </div>
      </div>
      <div id="zone-hand" class="cardzone zone-hand" data-zone="hand"></div>
    </footer>

    <aside id="side" class="side" hidden>
      <div class="side-head">
        <span>Mission log</span>
        <button class="btn btn-icon is-close" data-action="toggle-side" aria-label="Close panel"></button>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <div class="chat-tabs">
        <button class="btn chat-tab is-on" data-action="chat-scope" data-scope="room">Room</button>
        <button class="btn chat-tab" data-action="chat-scope" data-scope="global">Global</button>
      </div>
      <div id="chat-msgs" class="chat-msgs"></div>
      <div class="chat-row">
        <input id="chat-input" class="field" type="text" maxlength="500" placeholder="Message&hellip;"
               autocomplete="off" aria-label="Chat message">
        <button class="btn" data-action="send-chat">Send</button>
      </div>
    </aside>
  </section>

  <!-- ── OVERLAYS ───────────────────────────────────────────────────── -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button class="btn btn-icon is-close" data-action="close-sheet" aria-label="Close"></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="win-overlay" class="win-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-box">
      <div class="win-star" aria-hidden="true">
        <svg viewBox="0 0 100 100" focusable="false">
          <path d="M50 12 61.4 41.3 92.5 43.2 68.4 62.9 76.3 93 50 76.3 23.7 93 31.6 62.9 7.5 43.2 38.6 41.3Z"/>
        </svg>
      </div>
      <h1 id="win-title"></h1>
      <p id="win-reason" class="hint"></p>
      <div id="win-summary" class="win-summary"></div>
      <button id="btn-rematch" class="btn btn-primary" data-action="rematch">Rematch</button>
      <button id="btn-win-leave" class="btn btn-ghost" data-action="leave-room">Leave room</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="emotes" class="emotes" aria-hidden="true"></div>
</div>

<script type="module" src="/src/main.js?v=1"></script>
</body>
</html>
